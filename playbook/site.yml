- name: Install Vector
  hosts: clickhouse
  become: true
  vars:
    vector_version: "0.34.0"
    vector_arch: "x86_64"
    vector_download_url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}-unknown-linux-gnu.tar.gz"
    vector_install_dir: "/opt/vector"
    vector_config_dir: "/etc/vector"
    vector_data_dir: "/var/lib/vector"
    vector_archive_path: "/tmp/vector-{{ vector_version }}.tar.gz"
  handlers:
    - name: Restart vector service
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true
      become: true

    - name: Clean up vector archive
      ansible.builtin.file:
        path: "{{ vector_archive_path }}"
        state: absent
      listen: "cleanup vector archive"

  tasks:
    - name: Ensure required directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"
        - "{{ vector_data_dir }}"

    - name: Check if vector is already installed
      ansible.builtin.stat:
        path: "{{ vector_install_dir }}/bin/vector"
      register: vector_installed

    - name: Check if vector archive exists
      ansible.builtin.stat:
        path: "{{ vector_archive_path }}"
      register: vector_archive_check
      when: not vector_installed.stat.exists

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "{{ vector_download_url }}"
        dest: "{{ vector_archive_path }}"
        mode: '0644'
        timeout: 60
        validate_certs: true
        checksum: "sha256:https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}-unknown-linux-gnu.tar.gz.sha256"
      when:
        - not vector_installed.stat.exists
        - not vector_archive_check.stat.exists | default(false)
      register: vector_download
      retries: 3
      delay: 5
      until: vector_download is success

    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "{{ vector_archive_path }}"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=2
          - --transform=s/vector-{{ vector_version }}-{{ vector_arch }}-unknown-linux-gnu/vector/
        creates: "{{ vector_install_dir }}/bin/vector"
      when:
        - not vector_installed.stat.exists
        - vector_archive_check.stat.exists | default(false) or vector_download.changed

    - name: Create symlink for vector binary
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/bin/vector"
        dest: "/usr/local/bin/vector"
        state: link
        mode: '0755'
        force: true
      when: not vector_installed.stat.exists

    - name: Check if vector config exists and get its checksum
      ansible.builtin.stat:
        path: "{{ vector_config_dir }}/vector.toml"
      register: vector_config_check

    - name: Generate config checksum for comparison
      ansible.builtin.slurp:
        src: "{{ vector_config_dir }}/vector.toml"
      register: config_content
      when: vector_config_check.stat.exists
      no_log: true

    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: vector.toml.j2
        dest: "{{ vector_config_dir }}/vector.toml"
        mode: '0644'
        owner: root
        group: root
      notify: Restart vector service
      register: config_deploy
      when: >
        not vector_config_check.stat.exists or
        (config_content.content | b64decode | hash('sha1') != lookup('template', 'vector.toml.j2') | hash('sha1'))

    - name: Validate Vector configuration
      ansible.builtin.command:
        cmd: "/usr/local/bin/vector validate {{ vector_config_dir }}/vector.toml"
      register: validate_config
      changed_when: false
      failed_when: validate_config.rc != 0
      when:
        - config_deploy.changed
        - vector_installed.stat.exists or (vector_installed.stat.exists is defined and vector_installed.stat.exists)

    - name: Check if vector service exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/vector.service"
      register: vector_service_check

    - name: Create Vector systemd service
      ansible.builtin.template:
        src: vector.service.j2
        dest: "/etc/systemd/system/vector.service"
        mode: '0644'
        owner: root
        group: root
      notify: Restart vector service
      when: not vector_service_check.stat.exists

    - name: Check if vector service is running
      ansible.builtin.systemd:
        name: vector
        state: started
      register: vector_status_check
      ignore_errors: true

    - name: Enable and start Vector service
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
        daemon_reload: true
      when: vector_status_check.failed or vector_status_check.status.ActiveState != 'active'

    - name: Wait for Vector to start
      ansible.builtin.wait_for:
        port: 8686
        host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
        delay: 5
        timeout: 30
      register: vector_wait
      failed_when:
        - vector_wait is failed
        - "'Timeout' not in vector_wait.msg"
      changed_when: false
      when: vector_status_check.failed or vector_status_check.status.ActiveState != 'active'

    - name: Clean up vector archive after successful installation
      ansible.builtin.file:
        path: "{{ vector_archive_path }}"
        state: absent
      when:
        - vector_installed.stat.exists or (vector_installed.stat.exists is defined and vector_installed.stat.exists)
        - vector_archive_check.stat.exists | default(false)

    - name: Verify Vector is running
      ansible.builtin.systemd:
        name: vector
        state: started
      register: vector_status
      failed_when: vector_status.status.ActiveState != 'active'
